[package]
name = "dcma-topology"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
serial_test = "3"

[dependencies]
dcma-core = { path = "../dcma-core" }
dcma-contradiction = { path = "../dcma-contradiction" }
petgraph = { version = "0.7", features = ["serde-1"] }
rust_decimal = { version = "1", features = ["serde", "maths"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
