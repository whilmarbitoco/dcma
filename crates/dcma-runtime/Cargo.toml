[package]
name = "dcma-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
dcma-core = { path = "../dcma-core" }
dcma-activation = { path = "../dcma-activation" }
dcma-retrieval = { path = "../dcma-retrieval" }
dcma-contradiction = { path = "../dcma-contradiction" }
dcma-entropy = { path = "../dcma-entropy" }
dcma-consolidation = { path = "../dcma-consolidation" }
dcma-topology = { path = "../dcma-topology" }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
dcma-pg = { path = "../dcma-pg" }

[dev-dependencies]
dcma-ingest = { path = "../dcma-ingest" }
dcma-storage = { path = "../dcma-storage" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serial_test = "3"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dcma_benchmarks"
path = "benches/dcma_benchmarks.rs"
harness = false
