[package]
name = "dcma-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dcma-server"
path = "src/main.rs"

[dependencies]
dcma-core = { path = "../dcma-core" }
dcma-runtime = { path = "../dcma-runtime" }
dcma-pg = { path = "../dcma-pg" }
dcma-ingest = { path = "../dcma-ingest" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.7"
rust_decimal = "1"
