[package]
name = "dcma-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
dcma-core = { path = "../dcma-core" }
dcma-runtime = { path = "../dcma-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
unicode-segmentation = "1"
